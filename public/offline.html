<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dbeafe" />
    <title>McGillTrack Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e0f2fe;
        color: #172554;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        border: 2px solid #60a5fa;
        background: white;
        padding: 1rem;
        box-shadow: 5px 5px 0 #fef3c7;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>McGillTrack is offline</h1>
      <p>
        Reconnect to load the newest tracker. Local data saved on this device is
        still protected in the browser.
      </p>
    </main>
  </body>
</html>
